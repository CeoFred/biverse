name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - name: Ruff (target py38)
        run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python only ships 3.8 for Ubuntu 22.04
          - python: "3.8"
            os: ubuntu-22.04
            reqs: requirements-legacy.txt
          - python: "3.12"
            os: ubuntu-latest
            reqs: requirements.txt
    runs-on: ${{ matrix.os }}
    name: test (py${{ matrix.python }})
    env:
      BIVERSE_REQUIRE_DB: "1"
      BIVERSE_REQUIRE_VOSK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (PortAudio, TTS for the recognition test, Xvfb for Tk)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 espeak-ng xvfb
      - name: Python packages
        run: pip install -r ${{ matrix.reqs }}
      - name: Byte-compile everything
        run: python -m compileall -q biverse tools tests packaging/launcher.py
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: sources-${{ hashFiles('tools/build_bible_db.py', 'tools/fetch_model.py') }}
      - name: Build Bible database
        run: python tools/build_bible_db.py
      - name: Fetch speech models
        run: python tools/fetch_model.py --name kroko,vosk-small
      - name: Tests
        run: xvfb-run -a python -m pytest -q -rs
      - name: Self-test from source
        run: xvfb-run -a python -m biverse --self-test

  screenshots:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb imagemagick fonts-dejavu
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: sources-${{ hashFiles('tools/build_bible_db.py', 'tools/fetch_model.py') }}
      - run: python tools/build_bible_db.py && python tools/fetch_model.py --name kroko
      - name: Operator window at 1024x600 and 1920x1080, projector output at 1920x1080
        run: |
          BIVERSE_THEME=light xvfb-run -a -s "-screen 0 1024x600x24"  python tools/screenshots.py operator shots/operator-1024x600.png
          BIVERSE_THEME=light xvfb-run -a -s "-screen 0 1920x1080x24" python tools/screenshots.py operator shots/operator-1920x1080.png
          xvfb-run -a -s "-screen 0 1920x1080x24" python tools/screenshots.py output shots/output-1920x1080.png
          BIVERSE_THEME=dark xvfb-run -a -s "-screen 0 1024x600x24" python tools/screenshots.py operator shots/operator-dark-1024x600.png
          BIVERSE_THEME=dark xvfb-run -a -s "-screen 0 1920x1080x24" python tools/screenshots.py operator shots/operator-dark-1920x1080.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

  parakeet:
    # The high-accuracy pack is large (~480 MB), so it gets its own cached job.
    runs-on: ubuntu-latest
    needs: test
    env:
      BIVERSE_REQUIRE_VOSK: "1"
      BIVERSE_REQUIRE_PARAKEET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 espeak-ng
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: parakeet-${{ hashFiles('tools/fetch_model.py') }}
      - run: python tools/fetch_model.py --name parakeet
      - name: Parakeet recognition test
        run: python -m pytest -q -rs tests/test_recognition.py -k parakeet
      - name: Build the model pack and install it like a user would
        run: |
          python tools/fetch_model.py --name parakeet --pack pack.zip
          python -c "from biverse import modelpack; print(modelpack.install('pack.zip', 'installed').label)"

  ai-summary:
    # The optional AI summary pack (~1.1 GB model + llama.cpp). Runs the real model once.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: ai-summary-${{ hashFiles('tools/fetch_model.py') }}
      - name: Install the AI pack (Linux binary only)
        run: python tools/fetch_model.py --name ai-summary --platforms linux-x64 --dest "$HOME/ai"
      - name: Write a summary with the real model
        run: |
          mkdir -p "$RUNNER_TEMP/cfg/models" && mv "$HOME/ai/"* "$RUNNER_TEMP/cfg/models/"
          BIVERSE_CONFIG_DIR="$RUNNER_TEMP/cfg" python - <<'EOF'
          import time
          from biverse import llm
          from biverse.summary import SermonLog, summarise
          log = SermonLog(started=0)
          for t, line in enumerate([
              "Please turn with me to John chapter three verse sixteen.",
              "The point is that the love of God is a gift we receive by faith and not by our works.",
              "Many people try to earn the love of God by working harder and harder every day.",
              "Remember this: grace means God's love comes before our work, not after it.",
              "In conclusion, receive the gift of his love and share it with someone this week."]):
              log.add_line(line, when=t * 30)
          log.add_ref("John 3:16", when=20)
          pack = llm.find_pack()
          assert pack is not None, "AI pack not found"
          t = time.time()
          text = llm.summarise_ai(pack, summarise(log))
          print("---- AI summary (%.1f s) ----\n%s" % (time.time() - t, text))
          assert len(text.split()) >= 15, text
          assert "love" in text.lower() or "grace" in text.lower(), text
          assert "turn with me" not in text.lower(), text  # navigation is not a point
          assert "main message" in text.lower() or "- " in text, text  # follows the format
          EOF
